<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Catálogo Inteligente de Conversão de Peças - Centro Automotivo Silva">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA & Mobile Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Catálogo Silva">
  <meta name="theme-color" content="#081220">

  <link rel="manifest" href="manifest.json">
  <title>Catálogo Silva — Conversão de Peças</title>

  <style>
    body {
      margin: 0;
      background-color: #081220;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1E3A5F;
      border-top: 4px solid #FFB703;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      color: #FFB703;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 4px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="spinner"></div>
    <div class="title">CENTRO AUTOMOTIVO SILVA</div>
    <div class="subtitle">Carregando Catálogo Inteligente de Peças...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
